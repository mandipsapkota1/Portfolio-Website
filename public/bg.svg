<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#121a2b"/>
      <stop offset="45%"  stop-color="#0d1220"/>
      <stop offset="100%" stop-color="#07090f"/>
    </linearGradient>

    <radialGradient id="glowYellow" cx="50%" cy="26%" r="52%">
      <stop offset="0%"   stop-color="#e8ff48" stop-opacity=".22"/>
      <stop offset="45%"  stop-color="#e8ff48" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#e8ff48" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCool" cx="10%" cy="90%" r="55%">
      <stop offset="0%"   stop-color="#3d6dff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#3d6dff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowEdge" cx="94%" cy="16%" r="42%">
      <stop offset="0%"   stop-color="#cce630" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#cce630" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridFine" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".030" stroke-width="1"/>
    </pattern>
    <pattern id="gridBold" width="192" height="192" patternUnits="userSpaceOnUse">
      <path d="M192 0H0V192" fill="none" stroke="#e8ff48" stroke-opacity=".045" stroke-width="1"/>
    </pattern>

    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#e8ff48" stop-opacity=".075"/>
      <stop offset="100%" stop-color="#e8ff48" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1600" height="900" fill="url(#gridFade)"/></mask>

    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="55%"  stop-color="#07090f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07090f" stop-opacity=".85"/>
    </radialGradient>

    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>

  <g mask="url(#gridMask)">
    <rect width="1600" height="900" fill="url(#gridFine)"/>
    <rect width="1600" height="900" fill="url(#gridBold)"/>
  </g>

  <g opacity=".9">
    <polygon points="1180,-120 1420,-120 720,900 400,900" fill="url(#beam)"/>
    <polygon points="1520,-120 1600,-120 1080,900 900,900" fill="url(#beam)" opacity=".6"/>
  </g>

  <g fill="none" stroke="#e8ff48" filter="url(#soften)">
    <circle cx="800" cy="300" r="180" stroke-opacity=".13" stroke-width="1"/>
    <circle cx="800" cy="300" r="300" stroke-opacity=".085" stroke-width="1"/>
    <circle cx="800" cy="300" r="440" stroke-opacity=".055" stroke-width="1"/>
    <circle cx="800" cy="300" r="600" stroke-opacity=".035" stroke-width="1"/>
  </g>

  <g fill="none" stroke="#e8ff48" stroke-linecap="round">
    <path d="M 620 300 A 180 180 0 0 1 731 134" stroke-opacity=".40" stroke-width="2"/>
    <path d="M 1100 300 A 300 300 0 0 1 986 531" stroke-opacity=".26" stroke-width="2"/>
    <path d="M 800 740 A 440 440 0 0 1 428 490" stroke-opacity=".16" stroke-width="1.5"/>
  </g>

  <g fill="#e8ff48">
    <circle cx="800"  cy="120" r="3"   fill-opacity=".55"/>
    <circle cx="1100" cy="300" r="2.5" fill-opacity=".40"/>
    <circle cx="500"  cy="300" r="2.5" fill-opacity=".40"/>
    <circle cx="1015" cy="512" r="2"   fill-opacity=".30"/>
    <circle cx="585"  cy="512" r="2"   fill-opacity=".30"/>
    <circle cx="800"  cy="740" r="2"   fill-opacity=".22"/>
    <circle cx="360"  cy="180" r="1.8" fill-opacity=".30"/>
    <circle cx="1290" cy="640" r="1.8" fill-opacity=".26"/>
    <circle cx="180"  cy="620" r="1.6" fill-opacity=".20"/>
    <circle cx="1440" cy="240" r="1.6" fill-opacity=".22"/>
  </g>

  <rect width="1600" height="900" fill="url(#glowCool)"/>
  <rect width="1600" height="900" fill="url(#glowEdge)"/>
  <rect width="1600" height="900" fill="url(#glowYellow)"/>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
